name: Deploy (insecure)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Announce
        run: echo "Deploying PR ${{ github.event.pull_request.title }}"

      - name: Fake deploy
        run: |
          DEPLOY_TOKEN=hunter2-not-a-real-token
          echo "Using token $DEPLOY_TOKEN to deploy"
