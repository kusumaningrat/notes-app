services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - notes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No ports: database is internal only

  backend:
    image: notes-backend:1.0
    environment:
      PORT: ${PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "${PORT}:${PORT}"
    networks:
      - proxy
      - default
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: notes-frontend:1.0
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    networks:
      - proxy
      - default
    depends_on:
      - backend

volumes:
  notes-db-data:

networks:
  proxy:
    external: true
